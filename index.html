<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Los Juegos de Arturo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arturo">
<meta name="theme-color" content="#2a1b4d">
<link rel="stylesheet" href="fonts.css">
<style>
  :root {
    color-scheme: light;
    --ink: #2a1b4d;
    --font: "Baloo 2", "Arial Rounded MT Bold", ui-rounded, system-ui, sans-serif;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: var(--font); color: var(--ink); -webkit-user-select: none; user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    background: linear-gradient(180deg, #5aa9ff 0%, #9fd3ff 55%, #c9f0ff 100%);
    display: grid; grid-template-rows: auto 1fr; align-items: center; justify-items: center;
    padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); box-sizing: border-box;
  }
  /* nubes que pasan */
  .cloud { position: fixed; background: #fff; border-radius: 999px; opacity: .9; z-index: 0; animation: drift linear infinite; }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 55%; height: 160%; left: 12%; top: -70%; }
  .cloud::after { width: 40%; height: 120%; right: 12%; top: -45%; }
  @keyframes drift { from { transform: translateX(-30vw) } to { transform: translateX(130vw) } }
  /* colinas */
  .hill { position: fixed; bottom: -40vh; border-radius: 50%; z-index: 0; }
  h1 { position: relative; z-index: 1; margin: 0; text-align: center; line-height: .85; transform: rotate(-2deg); filter: drop-shadow(0 8px 0 rgba(42,27,77,.3)); }
  h1 .a { display: block; font-weight: 800; font-size: clamp(26px, 5vw, 56px); color: #fff; -webkit-text-stroke: clamp(6px, .9vw, 11px) var(--ink); paint-order: stroke fill; }
  h1 .b { display: block; font-weight: 800; font-size: clamp(54px, 11vw, 130px); color: #ffc53d; -webkit-text-stroke: clamp(9px, 1.5vw, 17px) var(--ink); paint-order: stroke fill; }
  .games { position: relative; z-index: 1; display: flex; gap: clamp(18px, 4vw, 56px); justify-content: center; align-items: center; flex-wrap: wrap; width: 100%; }
  .game {
    --w: min(40vw, 460px, 62vh); width: var(--w); border: 0; padding: 0; cursor: pointer; background: #fff; border-radius: calc(var(--w) * .1);
    box-shadow: 0 12px 0 var(--d), 0 22px 40px rgba(30,20,60,.35); transform: rotate(var(--r)); animation: float 3.2s ease-in-out infinite; animation-delay: var(--del);
    transition: transform .12s; font-family: var(--font); position: relative;
  }
  .game:active { transform: rotate(var(--r)) translateY(8px) scale(.97); box-shadow: 0 4px 0 var(--d), 0 10px 20px rgba(30,20,60,.3); }
  .game.go { animation: goAway .7s cubic-bezier(.5,-0.4,.7,1) forwards; }
  @keyframes float { 50% { transform: rotate(var(--r)) translateY(-10px); } }
  @keyframes goAway { 30% { transform: rotate(0) scale(1.08); } 100% { transform: rotate(0) scale(3); opacity: 0; } }
  .game .pic { display: block; width: calc(100% - 24px); margin: 12px 12px 0; aspect-ratio: 900 / 630; border-radius: calc(var(--w) * .07); object-fit: cover; }
  .game .name { display: block; padding: .15em 0 .25em; font-weight: 800; font-size: calc(var(--w) * .12); line-height: 1.1; color: #fff; -webkit-text-stroke: calc(var(--w) * .02) var(--ink); paint-order: stroke fill; }
  .game .badge { position: absolute; top: -18px; right: -14px; width: calc(var(--w) * .24); aspect-ratio: 1; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 0 var(--d); animation: pulse 1.4s ease-in-out infinite; }
  .game .badge svg { width: 56%; height: 56%; }
  @keyframes pulse { 50% { transform: scale(1.12) rotate(8deg); } }
  #g1 { --r: -3deg; --c: #ff5a7a; --d: #c72c52; --del: 0s; background: linear-gradient(170deg, #ff9bb0, #ff5a7a); }
  #g2 { --r: 3deg; --c: #ff8a00; --d: #c85f00; --del: -1.6s; background: linear-gradient(170deg, #ffc15c, #ff8a00); }
  @media (max-aspect-ratio: 1/1) { .game { --w: min(78vw, 420px, 36vh); } }
  @media (prefers-reduced-motion: reduce) { .game, .badge, .cloud { animation: none !important; } }
  #gate { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(circle at 50% 35%, #7d5cff, #2a1b4d 75%); padding: 16px; }
  #gate[hidden] { display: none; }
  #gate .box { width: min(380px, 100%); display: grid; gap: 16px; text-align: center; color: #fff8ee; }
  #gate h2 { margin: 0; font-size: 34px; line-height: 1.05; font-weight: 800; }
  #gate p { margin: 0; font-weight: 600; opacity: .8; }
  #gate input { font: 800 26px var(--font); text-align: center; padding: 14px; border-radius: 18px; border: 0; color: #2a1b4d; letter-spacing: .2em; }
  #gate button { font: 800 24px var(--font); padding: 14px; border-radius: 999px; border: 0; background: #2fd073; color: #fff; box-shadow: 0 8px 0 #179a4c; cursor: pointer; }
  #gate .err { color: #ffb3c1; min-height: 1.3em; font-weight: 700; }
</style>
</head>
<body>
  <div id="gate" hidden><form class="box" id="gateForm">
    <h2>Los juegos<br>de Arturo</h2>
    <p>Contraseña (solo la primera vez)</p>
    <input id="gatePw" type="password" inputmode="numeric" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">
    <button type="submit">Entrar</button>
    <div class="err" id="gateErr"></div>
  </form></div>
  <div class="cloud" style="top:12vh;width:160px;height:44px;animation-duration:48s;animation-delay:-10s"></div>
  <div class="cloud" style="top:30vh;width:110px;height:32px;animation-duration:36s;animation-delay:-25s"></div>
  <div class="cloud" style="top:6vh;width:90px;height:26px;animation-duration:60s;animation-delay:-40s"></div>
  <div class="hill" style="left:-20vw;width:80vw;height:70vh;background:#7ed957"></div>
  <div class="hill" style="right:-25vw;width:90vw;height:75vh;background:#5ec43f"></div>

  <h1><span class="a">Los juegos de</span><span class="b">Arturo</span></h1>
  <div class="games">
    <button class="game" id="g1" data-go="montana/" data-say="montana" aria-label="La montaña rusa">
      <img class="pic" src="montana.jpg" alt="">
      <span class="name">Montaña rusa</span>
      <span class="badge"><svg viewBox="0 0 100 100"><path d="M36 24 Q30 20 30 28 L30 72 Q30 80 37 76 L76 54 Q82 50 76 46 Z" fill="#fff"/></svg></span>
    </button>
    <button class="game" id="g2" data-go="carreras/" data-say="carreras" aria-label="Las carreras">
      <img class="pic" src="carreras.jpg" alt="">
      <span class="name">Carreras</span>
      <span class="badge"><svg viewBox="0 0 100 100"><path d="M36 24 Q30 20 30 28 L30 72 Q30 80 37 76 L76 54 Q82 50 76 46 Z" fill="#fff"/></svg></span>
    </button>
  </div>

<script>
  // Contraseña al entrar: se comprueba descifrando el juego (misma clave que usan los dos juegos) y se recuerda.
  const get = () => { try { return localStorage.getItem('arturo.pw'); } catch (e) { return null; } };
  const set = (v) => { try { localStorage.setItem('arturo.pw', v); } catch (e) {} };
  let encBuf = null;
  async function check(pw) {
    try {
      encBuf ||= new Uint8Array(await (await fetch('montana/app.enc', { cache: 'no-store' }).catch(() => fetch('montana/app.enc'))).arrayBuffer());
      const salt = encBuf.slice(0, 16), iv = encBuf.slice(16, 28), data = encBuf.slice(28);
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
      return true;
    } catch (e) { return false; }
  }
  const gate = document.getElementById('gate');
  if (!get()) {
    gate.hidden = false;
    document.getElementById('gateForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('gatePw').value.trim().toLowerCase();
      const err = document.getElementById('gateErr');
      err.textContent = 'Abriendo…';
      if (await check(pw)) { set(pw); gate.hidden = true; greeted = true; play('hola'); }
      else err.textContent = 'Esa no es. Prueba otra vez.';
    });
  }
  const clips = { hola: new Audio('hola.mp3'), montana: new Audio('montana.mp3'), carreras: new Audio('carreras.mp3') };
  let greeted = false, busy = false;
  const play = (k) => { try { Object.values(clips).forEach((a) => { a.pause(); a.currentTime = 0; }); return clips[k].play(); } catch (e) { return Promise.resolve(); } };
  // saludo: si el navegador lo permite al abrir; si no, al primer toque en el fondo
  if (get()) setTimeout(() => play('hola')?.then?.(() => (greeted = true)).catch(() => {}), 500);
  document.body.addEventListener('pointerdown', (e) => { if (!greeted && !e.target.closest('.game')) { greeted = true; play('hola'); } });
  document.querySelectorAll('.game').forEach((b) => b.addEventListener('click', () => {
    if (busy) return; busy = true;
    play(b.dataset.say);
    b.classList.add('go');
    document.querySelectorAll('.game').forEach((o) => { if (o !== b) o.style.opacity = .3; });
    setTimeout(() => (location.href = b.dataset.go), 1300);
  }));
  // al volver con "atrás" desde un juego, dejar el menú como nuevo
  addEventListener('pageshow', () => { busy = false; document.querySelectorAll('.game').forEach((o) => { o.classList.remove('go'); o.style.opacity = ''; }); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
